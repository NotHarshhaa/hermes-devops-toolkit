<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Original Open Graph image for Hermes DevOps Toolkit -->
  <defs>
    <radialGradient id="glow" cx="80%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#0000f2" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0000f2" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="#07070f"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Brand mark -->
  <rect x="80" y="88" width="72" height="72" rx="18" fill="#0000f2"/>
  <path d="M96 128h13l6-15 10 26 6-13h13"
        fill="none" stroke="#ffffff" stroke-width="5"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Wordmark -->
  <text x="180" y="136" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"
        font-size="30" font-weight="700" fill="#eef0f8">Hermes DevOps Toolkit</text>

  <!-- Headline -->
  <text x="80" y="270" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"
        font-size="64" font-weight="800" fill="#eef0f8" letter-spacing="-2">The DevOps toolkit</text>
  <text x="80" y="348" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"
        font-size="64" font-weight="800" fill="#3d3dff" letter-spacing="-2">that explains your failures</text>

  <!-- Subheading -->
  <text x="80" y="412" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"
        font-size="24" fill="#a3a8c2">Planned troubleshooting skills for Hermes Agent · Open source · MIT</text>

  <!-- Planned badges -->
  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="15" font-weight="600">
    <rect x="80" y="452" width="306" height="40" rx="10" fill="#10101d" stroke="#23233c"/>
    <text x="102" y="478" fill="#8f8fff">PLANNED · pipeline-failure-translator</text>

    <rect x="402" y="452" width="196" height="40" rx="10" fill="#10101d" stroke="#23233c"/>
    <text x="424" y="478" fill="#8f8fff">PLANNED · kube-explain</text>
  </g>

  <!-- Inert terminal strip: clearly an illustration, no real output -->
  <g>
    <rect x="80" y="520" width="1040" height="52" rx="12" fill="#0c0c18" stroke="#23233c"/>
    <circle cx="106" cy="546" r="6" fill="#ff5f57"/>
    <circle cx="126" cy="546" r="6" fill="#febc2e"/>
    <circle cx="146" cy="546" r="6" fill="#28c840"/>
    <text x="170" y="552" font-family="ui-monospace, Menlo, Consolas, monospace"
          font-size="16" fill="#62678a">$ Why did my GitHub Actions Docker build fail?  —  example prompt only (planned)</text>
  </g>
</svg>
